.ffoot-l,.ffoot-r{position:absolute;bottom:0;display:flex;flex-direction:column;gap:2px}
.ffoot-l{left:3%;text-align:left}
.ffoot-r{right:3%;text-align:right}
.ffoot-l b,.ffoot-r b{font-size:0.85cqw;letter-spacing:0.16em;color:#fff;font-weight:700}
.ffoot-l span,.ffoot-r span{font-size:0.65cqw;letter-spacing:0.13em;color:#888;font-weight:600}
.ffoot-c{position:absolute;left:50%;bottom:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px}
.ffoot-c b{font-size:0.65cqw;letter-spacing:0.13em;color:#888;font-weight:600;white-space:nowrap}
.ffoot-c span{font-size:0.55cqw;letter-spacing:0.1em;color:#888;font-weight:500;white-space:nowrap}
/* round board */
.board{padding:14px 2cqw}
.sec{flex-shrink:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:#0a1a2a;border:1px solid #565656;padding:4px 20px;margin-top:12px;user-select:none}.secL{display:flex;align-items:center;justify-content:space-around;gap:1.5cqw}.secR{display:flex;align-items:center;justify-content:space-around;gap:1.5cqw}
.tblock{display:flex;flex-direction:column;align-items:center;text-align:center;line-height:1;flex-shrink:0}
.tlabel{font-size:10px;letter-spacing:0.14em;color:#cfe3f5;font-weight:600;margin-bottom:4px;white-space:nowrap}
.timer,.tnum{font-family:'Bebas Neue',sans-serif;font-size:46px;letter-spacing:0.03em;color:#fff;font-variant-numeric:tabular-nums;line-height:0.95}
.timer.done{color:#fff;animation:none}
@keyframes tflash{0%,100%{opacity:1}50%{opacity:.2}}
.title{text-align:center;font-family:'Syncopate',sans-serif;font-weight:700;font-size:19px;letter-spacing:0.09em;white-space:nowrap;color:transparent;background:linear-gradient(90deg,#fff 0%,#fff 38%,#8cd0ff 50%,#fff 62%,#fff 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;animation:lvnshine 4.5s linear infinite}
.board .sts{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:1fr;gap:12px}
.cell{display:flex;flex-direction:column;min-height:0}
.top{flex-shrink:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;gap:6px;margin-bottom:4px;padding:0 3px}.stn{font-size:12px;letter-spacing:0.1em;color:#fff;text-align:left}.sdur{font-size:12px;letter-spacing:0.1em;color:#fff;text-align:right}
.trep{font-size:14px;font-weight:700;letter-spacing:0.05em;color:#1d9bf0;text-align:center;white-space:nowrap}
.trep.flash{animation:repflash 1.1s ease-in-out infinite}
@keyframes repflash{0%,100%{opacity:1;text-shadow:0 0 0 rgba(29,155,240,0)}50%{opacity:.55;text-shadow:0 0 10px rgba(29,155,240,.9)}}
.st{flex:1;min-height:0;background:rgba(32,32,32,0.90);border:1px solid #565656;padding:12px 10px;display:flex;flex-direction:column;overflow:hidden}
.ex{flex-shrink:0;font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:0.02em;line-height:1.08;text-align:center;margin-bottom:4px;text-decoration:underline;text-decoration-color:#6b7d8c;text-decoration-thickness:1px;text-underline-offset:3px;color:transparent;background:linear-gradient(90deg,#fff 0%,#fff 38%,#8cd0ff 50%,#fff 62%,#fff 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;animation:lvnshine 7s linear infinite}
.mao{flex-shrink:0;font-style:italic;font-weight:600;font-size:12px;letter-spacing:0.05em;color:#1d9bf0;text-align:center;line-height:1.1;margin-bottom:6px}
.media{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin:4px 0 8px;overflow:hidden;position:relative}
.sts .media::after{content:"";position:absolute;top:0;bottom:0;left:-45%;width:35%;background:linear-gradient(100deg,transparent 0%,rgba(255,255,255,0.26) 50%,transparent 100%);transform:skewX(-16deg);pointer-events:none;z-index:2;animation:vshine 13s linear infinite}
@keyframes vshine{0%{left:-45%;opacity:0}1%{opacity:1}9%{left:120%;opacity:1}10%{opacity:0}100%{left:120%;opacity:0}}
.sts .cell:nth-child(1) .media::after{animation-delay:0s}
.sts .cell:nth-child(2) .media::after{animation-delay:1.1s}
.sts .cell:nth-child(3) .media::after{animation-delay:2.2s}
.sts .cell:nth-child(4) .media::after{animation-delay:3.3s}
.sts .cell:nth-child(5) .media::after{animation-delay:4.4s}
.sts .cell:nth-child(6) .media::after{animation-delay:5.5s}
.sts .cell:nth-child(7) .media::after{animation-delay:6.6s}
.sts .cell:nth-child(8) .media::after{animation-delay:7.7s}
.sts .cell:nth-child(9) .media::after{animation-delay:8.8s}
.sts .cell:nth-child(10) .media::after{animation-delay:9.9s}
.media.ph{border:1px dashed #33424f;color:#33424f;font-size:10px;letter-spacing:0.16em}
.media video{width:calc(100% + 4px);height:calc(100% + 4px);object-fit:cover;display:block;margin:-2px}
.lv{flex-shrink:0;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.lvc{display:flex;flex-direction:column}
.lvn{font-size:10px;font-weight:600;letter-spacing:0.1em;text-align:center;margin-bottom:6px;white-space:nowrap;color:transparent;background:linear-gradient(90deg,#fff 0%,#fff 35%,#8cd0ff 50%,#fff 65%,#fff 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;animation:lvnshine 4.5s linear infinite}
.lvc:nth-child(1) .lvn{animation-delay:0s}.lvc:nth-child(2) .lvn{animation-delay:1.5s}.lvc:nth-child(3) .lvn{animation-delay:3s}
.lvb{display:flex;align-items:center;justify-content:center;text-align:center;background:rgba(10,26,42,0.90);border:1px solid #565656;padding:7px 4px;font-size:14px;color:#fff;line-height:1.1;min-height:38px}
