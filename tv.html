// Recovery segment: no video, no pillars — centered RECOVERY / WHAKAMĀTŪTŪ (+ timer when active)
function reccard(label,name,mao,dur,faded,secs){
 var cls="st r3card reccard"+(faded?" faded":"");
 var hdr='<div class="cardhdr"><span class="chl">'+label+'</span><span class="exn">&nbsp;</span><span class="rdur">'+(dur||"")+'</span></div>';
 var tmr=(secs>0)?'<span class="timer bigtimer mid" data-secs="'+secs+'" data-dir="down">'+mmss(secs)+'</span>':'';
 return '<div class="r3col"><div class="'+cls+'">'+hdr+'<div class="recmid"><div class="rectitle">'+E(name)+'</div><div class="recmao">'+(mao?E(mao):"")+'</div>'+tmr+'</div></div></div>';
}
function excard(label,ex,mao,dur,c,o,dd,tgt,media_on,faded,secs){
 if(isRec(ex))return reccard(label,ex,mao,dur,faded,secs);
 var cls="st r3card"+(faded?" faded":"");
 var hdr='<div class="cardhdr"><span class="chl">'+label+'</span><span class="exn">'+E(ex)+'</span><span class="rdur">'+(dur||"")+'</span></div>';
 var maoh='<div class="mao">'+(mao?E(mao):"&nbsp;")+'</div>';
 var med=media_on?media(ex,"exercises"):'';
 var pil=tgt?pillbox(c,o,dd):'';
 return '<div class="r3col"><div class="'+cls+'">'+hdr+maoh+med+pil+'</div></div>';
}
function kwcard(label,sub,timerattr){return '<div class="r3col"><div class="st r3card kwcard"><div class="kwmid"><div class="kwlabel">'+label+'</div><span class="timer bigtimer mid" '+timerattr+'>0:30</span><div class="startwith"><span class="swtext">'+sub+'</span> <span class="inarrow">&#10142;</span></div></div></div></div>';}
function previewcard(label,dur,body,faded){var cls="st r3card cardscroll"+(faded?" faded":"");var head='<div class="pvhead">'+label+'</div>';return '<div class="r3col"><div class="'+cls+'"><div class="pvbody"><div class="pvin body sess">'+head+body+'</div></div></div></div>';}
function screenWrap(inner,cls,extra){return '<div class="screen '+(cls||"")+'" '+(extra||"")+'>'+inner+'</div>';}


function fmtMinShort(d){var p=String(d||"").split(":");var m=parseInt(p[0])||0,s=parseInt(p[1])||0;return s===0?(m+"MIN"):(m+":"+(s<10?"0"+s:s)+"MIN");}
function isStationG(g){ if(g.st===true)return true; if(g.st===false)return false; var u={};g.sts.forEach(function(s){u[s.duration||""]=1;});return Object.keys(u).length<=1 && g.sts.length>2; }
function distinctEx(g){var seen={},o=[];g.sts.forEach(function(s){if(!seen[s.exercise]){seen[s.exercise]=1;o.push(s.exercise);}});return o;}
function roundSub(g){ var SEP='<span class="rsep">&middot;</span>'; if(isStationG(g)) return g.sts.length+" STATIONS"+SEP+fmtDur1(g.sts[0].duration)+" EACH"+SEP+fmtMinLabel(g.dur||mmss(roundSum(g))); var d=distinctEx(g); return "A: "+d.join(", ")+SEP+"B: "+d.join(", ")+SEP+fmtMinLabel(g.dur||mmss(roundSum(g))); }
function runpushSess(g){var order=[],mp={};g.sts.forEach(function(s){if(!mp[s.exercise]){mp[s.exercise]={row:s,c:0};order.push(s.exercise);}mp[s.exercise].c++;});
 var cols=order.map(function(ex){var m=mp[ex],s=m.row;
  var h='<div class="r3h">A: '+E(ex)+' <span class="lt">'+fmtMinShort(s.duration)+'</span></div>';
  var t='<div class="r3t"><span>COMMITMENT</span><b>'+E(s.c)+'</b></div><div class="r3t"><span>CONSISTENCY</span><b>'+E(s.o)+'</b></div><div class="r3t"><span>DETERMINATION</span><b>'+E(s.d)+'</b></div>';
  var b=m.c>1?'<div class="r3h b">B: '+E(ex)+' '+fmtMinShort(s.duration)+' <span class="lt">&middot; AS ABOVE</span></div>':'';
  return '<div class="scol">'+h+t+b+'</div>';}).join("");
 return '<div class="scols r3" style="grid-template-columns:repeat('+order.length+',minmax(0,17cqw))">'+cols+'</div>';}
function listOrBlock(g,startNum){ if(isStationG(g)){var items=g.sts.map(function(s,i){return {n:startNum+i,name:s.exercise};});return two_col(items);} return runpushSess(g); }
function previewBody(g,startNum){ return '<div class="rsub">'+roundSub(g)+'</div>'+listOrBlock(g,startNum)+(isStationG(g)?TAG:''); }
var WUV=VBASE+"warmups/";
function warmFile(nm){return nm.replace(/&ndash;/g,"-").replace(/&amp;/g,"&");}
var WARMNAMES=WU.map(function(w){return slug(w[0]);});
var WARMDISP=WU.map(function(w){return w[0];});
function transitionScreen(rlab,rnum,rtot,ss,tot,elapsed,total,nextg,startNum,scroll,wname){
 return screenWrap(motbar(scroll)+'<div class="cols">'+kwcard("KEEP WORKING&hellip;","COMING UP NEXT",'data-secs="30" data-dir="down"')+previewcard(nextg.hdr.toUpperCase(),fmtMinLabel(nextg.dur||mmss(roundSum(nextg))),previewBody(nextg,startNum),false)+'</div>'+clockbar({rlabel:rlab,rnum:rnum,rtot:rtot,ss:ss,sm:ss,tot:tot,elapsed:elapsed,total:total,sttime:30,stloop:false,roundtime:30,adv:true,advon:"round",wname:wname}),'board r3board','data-final');
}
function ccScreen(rlab,rnum,rtot,tot,elapsed,total,scroll,wname){
 var box='<div class="r3col"><div class="st r3card kwcard"><div class="kwmid"><div class="kwlabel">CLASS COMPLETE IN</div><span class="timer bigtimer mid" data-secs="30" data-dir="down" data-adv="1">0:30</span></div></div></div>';
 return screenWrap(motbar(scroll)+'<div class="cols one">'+box+'</div>'+clockbar({rlabel:rlab,rnum:rnum,rtot:rtot,ss:tot,sm:tot,tot:tot,elapsed:elapsed,total:total,sttime:30,stloop:false,roundtime:30,adv:false,wname:wname}),'board r3board','data-final');

function briefHTML(t){var parts=String(t).toUpperCase().replace(/\r/g,"").split(/\n{2,}/).map(function(p){return p.trim();}).filter(Boolean);return '<div class="sessbrief">'+parts.map(function(p){return '<div class="bp">'+E(p).replace(/\n/g,"<br>")+'</div>';}).join("")+'</div>';}
function pillarHTML(t){var blocks=String(t).toUpperCase().replace(/\r/g,"").split(/\n{2,}/).filter(function(b){return b.trim();});return '<div class="pillbrief">'+blocks.map(function(b){var lns=b.split("\n").map(function(x){return x.trim();}).filter(Boolean);return '<div class="grp">'+lns.map(function(ln,i){return i===0?'<div class="pbh">'+E(ln)+'</div>':'<div class="pbl">'+E(ln)+'</div>';}).join("")+'</div>';}).join("")+'</div>';}
function buildFlow(name,rows,opts){
 opts=opts||{}; var scroll=opts.scroll||PHRASES_DEFAULT;
 var m=String(name).match(/^(.*?)\s*(\d+)\s*$/); var base=(m?m[1]:name).trim().toUpperCase(); var num=m?m[2]:""; var wname=num?(base+" ("+num+")"):base;
 var cm=CLASSMAP[base]||CLASSMAP["RISE UP"];
 var groups=[],cur=null,inR=false;
 rows.forEach(function(r){ if(r.hdr!=null){inR=/round/i.test(r.hdr); if(inR){cur={hdr:r.hdr,dur:r.dur,st:r.st,hideTv:r.hideTv,split:(r.split===true),sts:[]};groups.push(cur);}else cur=null;} else if(inR&&cur)cur.sts.push(r); });
 if(!groups.length) return '<div style="color:#777;padding:40px;text-align:center">No rounds found for "'+E(name)+'".</div>';
 var total=0; groups.forEach(function(g){ total += durSecs(g.dur)||roundSum(g); });
 var totStn=0; groups.forEach(function(g){ totStn+=g.sts.length; });
 var rtot=groups.length;
 // Split-circuit: station rounds flagged "split" are one shared circuit — every board & preview shows all their stations.
 var splitG=groups.filter(function(g){return isStationG(g)&&g.split;});
 var splitOn=splitG.length>=2;
 var splitTot=0, splitCards="", splitRange={}, splitAllSts=[];
 if(splitOn){ var _n=0; splitG.forEach(function(g){ splitRange[groups.indexOf(g)]={ss:_n+1,sm:_n+g.sts.length}; g.sts.forEach(function(r){ _n++; splitCards+=stCard(r,_n); splitAllSts.push(r); }); }); splitTot=_n; }
 function isSplit(g){ return splitOn&&isStationG(g)&&g.split; }
 function dispG(g){ if(isSplit(g)){ var d={hdr:g.hdr,st:true,sts:splitAllSts}; d.dur=mmss(splitAllSts.reduce(function(a,s){return a+(durSecs(s.duration)||0);},0)); return d; } return g; }
 function pvStart(g,sn){ return isSplit(g)?1:sn; }
 // session brief — prefer the coach's written SESSION BRIEF from coaching notes; else auto-summary
 var sb;
 if(opts.brief){ sb=briefHTML(opts.brief); }
 else { sb=TAG; var acc0=0; groups.forEach(function(g){ sb+='<div class="rh">'+g.hdr.toUpperCase()+' <span>'+roundSub(g)+'</span></div>'+listOrBlock(g,acc0+1); acc0+=g.sts.length; }); }
 var warmBody='<div class="wlist">'+warmrows()+'</div>';
 var S=[];
 S.push(screenWrap('<div class="logo">TEAM 365</div><div class="subttl">CLASS BRIEF STARTING IN</div><div class="bigtimer" data-count>0:30</div>','brand','data-dur="30"'));
 S.push(screenWrap('<div class="cols">'+box("active","PILLAR BRIEF",'<div class="body pil">'+(opts.pillar?pillarHTML(opts.pillar):PILLAR)+'</div>')+box("faded","SESSION BRIEF",'<div class="body sess">'+sb+'</div>')+'</div>'+footer("PILLAR BRIEF","SESSION BRIEF","0:30",wname),'split','data-dur="30"'));
 S.push(screenWrap('<div class="cols">'+box("active","SESSION BRIEF",'<div class="body sess">'+sb+'</div>')+box("faded","WARM UP",'<div class="body warm">'+warmBody+'</div>')+'</div>'+footer("SESSION BRIEF","WARM UP","0:30",wname),'split','data-dur="30"'));
 S.push(screenWrap('<div class="cols">'+box("active","WARM UP",'<div class="body warm">'+warmBody+'</div>')+'<div class="col vidcol"><div class="media"><video id="warmvid" src="'+WUV+encodeURIComponent(WARMNAMES[0])+'.webm" autoplay muted loop playsinline onerror="var p=this.parentNode;p.className=\'media ph\';p.textContent=\'VIDEO COMING SOON\'"></video></div><div class="vcap"><span id="wcap">'+WARMDISP[0]+'</span></div></div></div>'+footer("WARM UP","30 SECS FINAL PREP","3:00",wname),'split','data-dur="180" data-warm'));
 var g0=groups[0];
 S.push(screenWrap('<div class="cols"><div class="col cen"><div class="boxin cenin"><div class="bh">CLASS STARTING IN&hellip;</div><div class="bigtimer mid" data-count>0:30</div><div class="startwith"><span class="swtext">STARTING WITH YOUR FIRST STATION</span> <span class="inarrow">&#10142;</span></div></div></div>'+previewcard(g0.hdr.toUpperCase(),fmtMinLabel(g0.dur||mmss(roundSum(g0))),previewBody(dispG(g0),1),false)+'</div>'+footer("CLASS STARTING IN",g0.hdr.toUpperCase(),"0:30",wname),'split','data-dur="30" data-cue'));
 var elapsed=0, acc=0;
 groups.forEach(function(g,ri){
   var rlab=g.hdr.toUpperCase(); var rnum=ri+1; var isLast=(ri===groups.length-1);
   var rsec=durSecs(g.dur)||roundSum(g); var nextg=groups[ri+1]; var nextStart=acc+g.sts.length+1;
   if(isStationG(g)){
     var _sp=(splitOn&&g.split&&splitRange[ri]);
     var cards=_sp?splitCards:g.sts.map(function(r,i){return stCard(r,acc+1+i);}).join("");
     var _ss=_sp?splitRange[ri].ss:(acc+1), _sm=_sp?splitRange[ri].sm:(acc+g.sts.length), _tot=_sp?splitTot:totStn;
     var sttime=durSecs(g.sts[0].duration)||60;
     S.push(screenWrap('<div class="sts">'+cards+'</div>'+clockbar({rlabel:rlab,rnum:rnum,rtot:rtot,ss:_ss,sm:_sm,tot:_tot,elapsed:elapsed,total:total,sttime:sttime,stloop:true,roundtime:rsec,adv:false,wname:wname}),'board','data-final'));
     if(!isLast) S.push(transitionScreen(rlab,rnum,rtot,acc+g.sts.length,totStn,elapsed+rsec-30,total,dispG(nextg),pvStart(nextg,nextStart),scroll,wname));
     else S.push(ccScreen(rlab,rnum,rtot,totStn,elapsed+rsec-30,total,scroll,wname));
   } else {
     var segEl=elapsed;
     g.sts.forEach(function(seg,si){
       var segsec=durSecs(seg.duration); var nxt=g.sts[si+1]; var isLastSeg=(si===g.sts.length-1);
       var left=excard(rlab,seg.exercise,seg.maori,fmtMinShort(seg.duration),seg.c,seg.o,seg.d,true,true,false,durSecs(seg.duration));
       var segEnd=segEl+segsec;
       if(isLastSeg&&isLast){
         var ccRight='<div class="r3col"><div class="st r3card kwcard"><div class="kwmid"><div class="kwlabel">CLASS COMPLETE IN</div><span class="timer bigtimer mid" data-secs="'+segsec+'" data-dir="down" data-adv="1">'+mmss(segsec)+'</span></div></div></div>';
         S.push(screenWrap(motbar(scroll)+'<div class="cols">'+left+ccRight+'</div>'+clockbar({rlabel:rlab,rnum:rnum,rtot:rtot,ss:acc+si+1,sm:acc+si+1,tot:totStn,elapsed:segEl,total:total,sttime:segsec,stloop:false,roundtime:elapsed+rsec-segEl,adv:false,wname:wname}),'board r3board','data-final'));
       } else {
         var boardRight = nxt ? excard("COMING UP NEXT &hellip;",nxt.exercise,nxt.maori,fmtMinShort(nxt.duration),nxt.c,nxt.o,nxt.d,true,true,true)
                              : previewcard(nextg.hdr.toUpperCase(),fmtMinLabel(nextg.dur||mmss(roundSum(nextg))),previewBody(dispG(nextg),pvStart(nextg,nextStart)),true);
         S.push(screenWrap(motbar(scroll)+'<div class="cols">'+left+boardRight+'</div>'+clockbar({rlabel:rlab,rnum:rnum,rtot:rtot,ss:acc+si+1,sm:acc+si+1,tot:totStn,elapsed:segEl,total:total,sttime:segsec,stloop:false,roundtime:elapsed+rsec-segEl,adv:false,wname:wname}),'board r3board','data-final'));
         if(nxt){
           var kwRight=excard("COMING UP NEXT &hellip;",nxt.exercise,nxt.maori,fmtMinShort(nxt.duration),nxt.c,nxt.o,nxt.d,true,true,false);
           S.push(screenWrap(motbar(scroll)+'<div class="cols">'+kwcard(isRec(seg.exercise)?"RECOVERY COMPLETED IN":"KEEP WORKING&hellip;","COMING UP NEXT",'data-secs="30" data-dir="down"')+kwRight+'</div>'+clockbar({rlabel:rlab,rnum:rnum,rtot:rtot,ss:acc+si+1,sm:acc+si+1,tot:totStn,elapsed:segEnd-30,total:total,sttime:30,stloop:false,roundtime:elapsed+rsec-(segEnd-30),adv:true,advon:"station",wname:wname}),'board r3board','data-final'));
         } else {
           S.push(transitionScreen(rlab,rnum,rtot,acc+si+1,totStn,segEnd-30,total,dispG(nextg),pvStart(nextg,nextStart),scroll,wname));
         }
       }
       segEl=segEnd;
     });
   }
   elapsed+=rsec; acc+=g.sts.length;
 });
 S.push('<div class="screen finalpg" data-final2><div class="finalbox"><div class="finalmid"><div class="finaltitle">'+cm.title+'</div><div class="finalsub">'+cm.sub+'</div></div><div class="finalbot"><div class="fbot1">'+cm.bot+'</div><div class="fbot2">EVERYDAY. ALL YEAR ROUND.</div></div></div></div>');
 return S.join("");
}


function runEngine(){
var AC=null;
function ensure(cb){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended'){AC.resume().then(function(){if(cb)cb();});}else{if(cb)cb();}}catch(e){}}
function unlock(){ensure();var a=document.getElementById('chimeAudio');if(a){a.muted=true;var p=a.play();if(p&&p.then)p.then(function(){a.pause();a.currentTime=0;a.muted=false;}).catch(function(){a.muted=false;});}}
function tone(f,d,ty,v,t0){if(!AC)return;var t=AC.currentTime+(t0||0);var o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.6,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.start(t);o.stop(t+d+0.05);}
function beep(){tone(1319,0.15,'square',0.6);tone(2638,0.15,'sine',0.15);}
function longBeep(){tone(1319,0.85,'square',0.72);tone(2638,0.85,'sine',0.18);}
function chime(){var a=document.getElementById('chimeAudio');if(a){try{a.currentTime=0;a.play();}catch(e){}}}
function roundBell(){ensure(function(){tone(392,1.1,'triangle',0.55);tone(523,1.1,'sine',0.45);tone(784,1.2,'sine',0.3,0.02);});}
function fmt(s){var m=Math.floor(s/60),ss=s%60;return m+':'+(ss<10?'0':'')+ss;}
function setCounts(sc,v){var cs=sc.querySelectorAll('[data-count]');for(var i=0;i<cs.length;i++)cs[i].textContent=fmt(v);}
function doFlash(){var f=document.getElementById('flash');if(!f)return;f.classList.remove('on');void f.offsetWidth;f.classList.add('on');}
var WSEG=[15,15,10,10,20,20,30,30,15,15];
function warmIdx(el){var a=0;for(var i=0;i<WSEG.length;i++){a+=WSEG[i];if(el<a)return i;}return WSEG.length-1;}
function updWarm(sc,idx){var rows=sc.querySelectorAll('.wr');for(var i=0;i<rows.length;i++)rows[i].classList.toggle('cur',i===idx);var cap=sc.querySelector('#wcap');if(cap&&rows[idx]){var nm=rows[idx].querySelector('.wn');cap.innerHTML=nm?nm.innerHTML:'';}var wv=document.getElementById('warmvid');if(wv&&typeof WARMNAMES!=='undefined'&&WARMNAMES[idx]){wv.style.display='';wv.src=WUV+WARMNAMES[idx]+'.webm';}}
var screens=[].slice.call(document.querySelectorAll('.screen'));
var cur=-1, introLeft=0, boardOn=false, paused=false;
var MARQUEE_PXPS=42; // scrolling-text speed in px/sec — lower = slower, uniform across all workouts
function setMarquee(sc){var ts=sc.querySelectorAll('.mtrack');for(var i=0;i<ts.length;i++){var tr=ts[i];if(tr.dataset.spd)continue;var t=tr.querySelector('.mtext');if(!t)continue;var w=t.scrollWidth||t.offsetWidth;if(w>0){tr.style.animationDuration=Math.max(20,Math.round(w/MARQUEE_PXPS))+'s';tr.dataset.spd='1';}}}
function eachVideo(sc,fn){var vs=(sc||document).querySelectorAll('video');for(var i=0;i<vs.length;i++)fn(vs[i]);}
function pauseVideos(sc){eachVideo(sc,function(v){try{v.pause();}catch(e){}});}
function playVideos(sc){eachVideo(sc,function(v){try{var p=v.play();if(p&&p.catch)p.catch(function(){});}catch(e){}});}
// Load+play only the current screen's videos; pause all others (frees browser video decoders so later boards render).
function actVideos(sc){var all=document.querySelectorAll('#stage video');for(var i=0;i<all.length;i++){var v=all[i];if(sc&&sc.contains(v)){var ds=v.getAttribute('data-src');if(ds&&!v.getAttribute('src'))v.setAttribute('src',ds);if(!paused){try{var p=v.play();if(p&&p.catch)p.catch(function(){});}catch(e){}}}else{try{v.pause();}catch(e){}}}}
function goFS(){var el=document.documentElement;var fn=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;if(fn){try{fn.call(el);}catch(e){}}}
function toggleFS(){var d=document;var fsel=d.fullscreenElement||d.webkitFullscreenElement;if(fsel){var ex=d.exitFullscreen||d.webkitExitFullscreen;if(ex){try{ex.call(d);}catch(e){}}}else{goFS();}}
var navEl=document.getElementById('nav');var navTimer=null;
function showNav(){if(!navEl)return;navEl.classList.add('on');if(navTimer)clearTimeout(navTimer);navTimer=setTimeout(function(){navEl.classList.remove('on');},4500);}
function startBoard(sc){boardOn=true;sc.querySelectorAll('.timer').forEach(function(t){t.dataset.left=t.dataset.secs;t.dataset.running='1';t.textContent=fmt(parseInt(t.dataset.secs));});}
function show(i){if(i<0||i>=screens.length)return;if(cur>=0)screens[cur].classList.remove('show');cur=i;var pn=document.getElementById('pnum');if(pn)pn.textContent=(i+1)+' / '+screens.length;var sc=screens[i];sc.classList.add('show');setMarquee(sc);actVideos(sc);boardOn=false;if(sc.hasAttribute('data-final')){startBoard(sc);return;}introLeft=parseInt(sc.getAttribute('data-dur'))||0;setCounts(sc,introLeft);if(sc.hasAttribute('data-warm'))updWarm(sc,0);}
function nextScreen(){if(cur<screens.length-1){roundBell();show(cur+1);}}
function prevScreen(){if(cur>0)show(cur-1);}
document.getElementById('pv').onclick=function(){unlock();prevScreen();};
document.getElementById('nx').onclick=function(){unlock();nextScreen();};
document.getElementById('pp').onclick=function(){unlock();paused=!paused;this.textContent=paused?'▶':'❘❘';document.body.classList.toggle('paused',paused);if(paused)pauseVideos();else actVideos(screens[cur]);showNav();};
(function(){var fsb=document.getElementById('fs');if(fsb)fsb.onclick=function(){toggleFS();showNav();};})();
document.body.addEventListener('click',function(){showNav();});
setInterval(function(){if(paused||!window.__started)return;var sc=screens[cur];if(!sc)return;
 if(sc.hasAttribute('data-final')){if(!boardOn)return;sc.querySelectorAll('.timer').forEach(function(t){if(t.dataset.running!=='1')return;var l=parseInt(t.dataset.left);if(t.dataset.dir==='up'){l+=1;var mx=t.dataset.max?parseInt(t.dataset.max):null;if(mx!==null&&l>=mx){l=mx;t.dataset.running='0';t.classList.add('done');}t.dataset.left=l;t.textContent=fmt(l);return;}l-=1;if(l<=0){if(t.dataset.loop==='1'){doFlash();var sn=sc.querySelector('.stnnum');if(sn){var vv=parseInt(sn.textContent);var mm=parseInt(sn.dataset.max||'999');if(vv<mm)sn.textContent=(vv+1)+' / '+(sn.dataset.tot||mm);}l=parseInt(t.dataset.secs);t.dataset.left=l;t.textContent=fmt(l);return;}t.dataset.left=0;t.textContent=fmt(0);t.dataset.running='0';t.classList.add('done');if(t.dataset.adv==='1'){setTimeout(nextScreen,500);}return;}t.dataset.left=l;t.textContent=fmt(l);if(t.dataset.loop==='1'){if(l===30)chime();else if(l===4||l===3||l===2)beep();else if(l===1)longBeep();}});return;}
 if(introLeft>0){introLeft-=1;setCounts(sc,introLeft);if(sc.hasAttribute('data-warm')){var dur=parseInt(sc.getAttribute('data-dur'));updWarm(sc,warmIdx(dur-introLeft));}if(sc.hasAttribute('data-cue')){if(introLeft===3||introLeft===2)beep();else if(introLeft===1)longBeep();}if(introLeft<=0){if(sc.hasAttribute('data-cue'))doFlash();nextScreen();}}
},1000);
