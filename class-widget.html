<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Team 365 · Book a Class</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Syncopate:wght@700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#080808;color:#fff;font-family:'DM Sans',sans-serif}
.widget{max-width:520px;margin:0 auto;padding:24px 16px 48px}
/* Mode bar */
.mode-bar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.mode-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:0.12em;color:#fff}
.mode-link{background:none;border:none;font-size:10px;letter-spacing:0.14em;color:#444;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;transition:color .15s;padding:2px 0}
.mode-link:hover{color:#aaa}
.w-sub{font-size:10px;letter-spacing:0.14em;color:#555;font-weight:600;margin-bottom:20px}
/* Progress dots */
.w-dots{display:flex;gap:6px;justify-content:center;margin-bottom:24px}
.w-dot{width:6px;height:6px;border-radius:50%;background:#1a1a1a;transition:all .2s}
.w-dot.active{background:#fff;width:18px;border-radius:0}
.w-dot.done{background:#444}
/* Login panel */
.login-panel{background:#141414;border:1px solid #666;border-radius:0;padding:20px;margin-bottom:20px}
.login-title{font-size:10px;letter-spacing:0.2em;color:#555;font-weight:600;margin-bottom:16px}
.form-group{margin-bottom:12px}
.fl{display:block;font-size:10px;letter-spacing:0.18em;color:#bbb;font-weight:600;margin-bottom:7px}
.fi{width:100%;background:#080808;border:1px solid #2a2a2a;color:#fff;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:300;padding:13px 14px;outline:none;border-radius:0;transition:border-color .2s;-webkit-appearance:none}
.fi:focus{border-color:#555}
.fi::placeholder{color:#333}
/* Member bar */
.member-bar{background:#141414;border:1px solid #666;border-radius:0;padding:10px 14px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center}
.member-name{font-size:11px;letter-spacing:0.1em;color:#aaa;font-weight:500}
.logout-btn{background:none;border:none;font-size:10px;letter-spacing:0.14em;color:#444;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600}
.logout-btn:hover{color:#aaa}
/* Week nav */
.week-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.wk-arrow{background:none;border:none;color:#888;cursor:pointer;font-size:22px;padding:4px 10px;line-height:1;transition:color .15s}
.wk-arrow:hover:not(:disabled){color:#fff}
.wk-arrow:disabled{color:#222;cursor:default}
.wk-label{flex:1;text-align:center;font-size:10px;letter-spacing:0.16em;color:#fff;font-weight:600}
/* Day strip */
.day-strip{display:flex;gap:5px;margin-bottom:16px}
.day-btn{flex:1;min-width:44px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;background:#141414;border:1px solid #333;border-radius:0;cursor:pointer;transition:all .15s}
.day-btn:hover:not(.da){border-color:#444}
.day-btn.dt{border-color:#555}
.day-btn.da{background:#fff;border-color:#fff}
.d-name{font-size:9px;letter-spacing:0.12em;font-weight:600;color:#999;text-align:center}
.d-num{font-family:'Bebas Neue',sans-serif;font-size:20px;line-height:1;color:#777}
.day-btn.dt .d-num{color:#fff}
.day-btn.dt .d-name{color:#ccc}
.day-btn.da .d-name,.day-btn.da .d-num{color:#000}
/* Session label */
.sess-lbl{font-size:9px;letter-spacing:0.2em;color:#555;font-weight:600;margin-bottom:12px}
/* Slot list */
.slot-list{display:flex;flex-direction:column;gap:7px;margin-bottom:20px}
/* Guest slots */
.slot-row{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#141414;border:1px solid #666;border-radius:0;cursor:pointer;transition:all .15s}
.slot-row:hover:not(.off):not(.past){border-color:#333}
.slot-row.sel{border-color:#fff;background:#111}
.slot-row.off{cursor:default}
/* Unavailable: fade the time and name, leave the status and button readable */
.slot-row.off .slot-time,.slot-row.off .slot-class{opacity:0.4}
.slot-row.past{opacity:0.3;cursor:default;pointer-events:none}
.slot-time-wrap{display:flex;flex-direction:column;min-width:72px}
.slot-time{font-family:'Bebas Neue',sans-serif;font-size:20px;color:#fff;line-height:1}
.slot-class{font-size:7px;letter-spacing:0.12em;color:#1d9bf0;font-weight:600;margin-top:1px}
.slot-mid{flex:1}
.slot-bars{display:flex;gap:2px;margin-bottom:5px}
.slot-bar{flex:1;height:2px;border-radius:0;background:#222;transition:background .3s}
.slot-bar.t{background:#fff}
.slot-info{font-size:10px;letter-spacing:0.1em;font-weight:500}
.slot-info.av{color:#aaa}.slot-info.lo{color:#e06040}.slot-info.fl{color:#555}.slot-info.ok{color:#1d9bf0}
/* Book button — same as the app */
.slot-btn{font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:0.12em;padding:8px 12px;border-radius:0;border:none;cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0}
.slot-btn.sb-book{background:#fff;color:#000}
.slot-btn.sb-book:hover:not(:disabled){background:#ddd}
.slot-btn.sb-off{background:transparent;color:#555;border:1px solid #2a2a2a;cursor:default;font-size:10px}
.slot-btn:disabled{opacity:.4;cursor:not-allowed}
/* Member slots */
.c-row{display:flex;align-items:center;gap:10px;padding:10px 13px;background:#141414;border:1px solid #666;border-radius:0;transition:border-color .15s}
.c-row.cb{border-color:#333}
.c-row.cp{opacity:0.3;pointer-events:none}
.c-time-wrap{display:flex;flex-direction:column;min-width:72px}
.c-time{font-family:'Bebas Neue',sans-serif;font-size:20px;color:#fff;line-height:1}
.c-class{font-size:7px;letter-spacing:0.12em;color:#1d9bf0;font-weight:600;margin-top:1px}
.c-mid{flex:1}
.c-bars{display:flex;gap:2px;margin-bottom:5px}
.c-bar{flex:1;height:2px;border-radius:0;background:#222;transition:background .3s}
.c-bar.ct{background:#fff}
.c-sub{font-size:10px;letter-spacing:0.1em;font-weight:500}
.co{color:#aaa}.cl{color:#e06040}.cf{color:#555}.cg{color:#1d9bf0}
.c-btn{border:none;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:0.1em;padding:8px 14px;border-radius:0;cursor:pointer;transition:all .15s;white-space:nowrap}
.bb{background:#fff;color:#000}
.bb:hover:not(:disabled){background:#ddd}
.bb:disabled{background:#111;color:#333;cursor:not-allowed}
.bc{background:transparent;color:#555;border:1px solid #333}
.bc:hover{border-color:#666;color:#aaa}
.bf{background:transparent;color:#333;border:1px solid #333;cursor:default}
/* Summary */
.summ{background:#141414;border:1px solid #666;border-radius:0;padding:16px;margin-bottom:20px}
.summ-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #111}
.summ-row:last-child{border-bottom:none}
.summ-lbl{font-size:10px;letter-spacing:0.12em;color:#555;font-weight:500}
.summ-val{font-size:10px;letter-spacing:0.08em;color:#ccc;font-weight:500;text-align:right}
/* Payment */
.pay-lbl{font-size:10px;letter-spacing:0.18em;color:#bbb;font-weight:600;margin-bottom:10px}
.pay-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.pay-opt{padding:14px 10px;background:#141414;border:1px solid #666;border-radius:0;text-align:center;transition:all .15s}
.pay-opt.clickable{cursor:pointer}
.pay-opt.clickable:hover{border-color:#333}
.pay-opt.sel{border-color:#fff}
.pay-opt.dim{opacity:0.3;cursor:default}
.pay-icon{font-size:20px;margin-bottom:7px}
.pay-name{font-size:11px;letter-spacing:0.1em;color:#ccc;font-weight:600}
.pay-hint{font-size:9px;color:#444;margin-top:3px}
/* Buttons */
.btn-p{width:100%;background:#fff;color:#000;border:none;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:0.18em;padding:16px;cursor:pointer;border-radius:0;transition:background .15s;margin-bottom:10px}
.btn-p:hover:not(:disabled){background:#ddd}
.btn-p:disabled{background:#111;color:#333;cursor:not-allowed}
.btn-g{width:100%;background:transparent;color:#555;border:1px solid #444;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:0.16em;padding:13px;cursor:pointer;border-radius:0;transition:all .15s}
.btn-g:hover{border-color:#333;color:#aaa}
/* Confirmation */
.conf{text-align:center;padding:10px 0}
.conf-icon{font-size:48px;margin-bottom:14px}
.conf-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:0.12em;margin-bottom:6px}
.conf-msg{font-size:12px;letter-spacing:0.04em;color:#777;line-height:1.9;margin-bottom:20px}
.ref-box{background:#141414;border:1px solid #666;border-radius:0;padding:14px;text-align:center;margin-bottom:18px}
.ref-lbl{font-size:9px;letter-spacing:0.2em;color:#555;margin-bottom:4px}
.ref-code{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:0.14em;color:#fff}
/* Misc */
.err-msg{font-size:12px;color:#e06040;letter-spacing:0.04em;margin-bottom:12px;line-height:1.5}
.loading{text-align:center;padding:30px 0;font-size:10px;letter-spacing:0.22em;color:#333}
.load-bar{width:80px;height:1px;background:#1a1a1a;border-radius:0;overflow:hidden;margin:12px auto 0}
.load-fill{height:100%;background:#fff;animation:ld 1.5s ease-in-out infinite}
@keyframes ld{0%{width:0}50%{width:100%}100%{width:0}}
</style>
</head>
<body>
<div id="root"><div class="loading" style="padding:60px 0">LOADING<div class="load-bar"><div class="load-fill"></div></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const{useState,useEffect,useCallback}=React;
// ── Config ────────────────────────────────────────────────────────────────────
const SB_URL="https://xczwmexavysvljmobbgv.supabase.co";
const SB_KEY="sb_publishable_tujGGhPRUimflq1-IFzuvA_Crw6knMO";
const SB_HDR={"apikey":SB_KEY,"Authorization":`Bearer ${SB_KEY}`,"Content-Type":"application/json","Prefer":"return=minimal"};
const APPS_URL="https://script.google.com/macros/s/AKfycbz5cruljVDUVScwm14Sj1z5_6cRrNK9cgOaq7Tx8P9LfPAEI7p_kx8ZJnaghF_SmU46Fw/exec";
const SHOPIFY_PAY_URL="https://www.lamontcollective.com/products/casual-gym-session";
const MAX_SPOTS=16;
// How far ahead guests may book. Must match the app and the other widgets.
const BOOKING_WEEKS=12;
const BOOKING_DAYS=BOOKING_WEEKS*7;
function bookingHorizonDS(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+BOOKING_DAYS);return toDS(d);}
const WD_TIMES=["05:15","06:15","07:15","09:15","12:00","17:15","18:15","19:15"];
const SAT_TIMES=["06:30","07:30","08:30","09:30"];
// ── Recurring class rules · __CLASS_DOW__ ────────────────────────────────────
// Same engine as the app. Rules sit alongside class_limits; a class_limits row
// for an exact date always wins (max_spots 0 = hidden for that date).
function classRuleActive(r,dk){
  if(!r||!r.time)return false;
  if(r.from&&dk<r.from)return false;
  if(r.until&&dk>r.until)return false;
  return true;
}
function classRulesOn(classDow,dk,kind){
  const dow=new Date(dk+"T00:00:00").getDay();
  return ((((classDow||{})[dow])||{})[kind]||[]).filter(r=>classRuleActive(r,dk));
}
function classAddRule(classDow,dk,time){
  return classRulesOn(classDow,dk,"add").find(r=>r.time===time)||null;
}
function classTimesFor(dk,baseTimes,dateAdds,dateHides,classDow){
  const rAdd=classRulesOn(classDow,dk,"add").map(r=>r.time);
  const rHide=classRulesOn(classDow,dk,"hide").map(r=>r.time);
  return [...new Set([...baseTimes,...rAdd,...(dateAdds||[])])]
    .filter(t=>(dateAdds||[]).includes(t)||!rHide.includes(t))
    .filter(t=>!(dateHides||[]).includes(t))
    .sort();
}
const DAY_SHORT=["Mon","Tue","Wed","Thu","Fri","Sat"];
const DAY_LONG=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
// ── Helpers ───────────────────────────────────────────────────────────────────
const mondayOf=d=>{const x=new Date(d);x.setHours(0,0,0,0);const day=x.getDay();x.setDate(x.getDate()-(day===0?6:day-1));return x;};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const toDS=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const isToday=d=>toDS(d)===toDS(new Date());
const isPastD=d=>toDS(d)<toDS(new Date());
const fmt12=t=>{const[h,m]=t.split(":").map(Number);return`${h%12||12}:${String(m).padStart(2,"0")}${h<12?"am":"pm"}`;};
const getWeekStart=()=>{const now=new Date();const m=mondayOf(now);return now.getDay()===0?addDays(m,7):m;};
const hashPw=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h)^s.charCodeAt(i);return(h>>>0).toString(36);};
function genRef(){const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let r="T365-";for(let i=0;i<6;i++)r+=c[Math.floor(Math.random()*c.length)];return r;}
function isPastSlot(date,time){
  if(isPastD(date))return true;
  if(!isToday(date))return false;
  const now=new Date();const[h,m]=time.split(":").map(Number);
  return(h*60+m+30)<(now.getHours()*60+now.getMinutes());
}
const lsGet=(k,fb=null)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch{return fb;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}};
// ── Supabase ──────────────────────────────────────────────────────────────────
async function sbGet(t,q=""){try{const r=await fetch(`${SB_URL}/rest/v1/${t}?${q}`,{headers:SB_HDR});return r.ok?await r.json():[];}catch{return[];}}
async function sbPost(t,d){try{const r=await fetch(`${SB_URL}/rest/v1/${t}`,{method:"POST",headers:SB_HDR,body:JSON.stringify(d)});return r.ok;}catch{return false;}}
// Same POST, but reports WHY it failed. 409 = this email already holds that slot.
async function sbPostStatus(t,d){
  try{const r=await fetch(`${SB_URL}/rest/v1/${t}`,{method:"POST",headers:SB_HDR,body:JSON.stringify(d)});
    return r.ok?{ok:true}:{ok:false,duplicate:r.status===409,status:r.status};
  }catch{return {ok:false,duplicate:false,status:0};}
}
async function sbDelete(t,q){try{const r=await fetch(`${SB_URL}/rest/v1/${t}?${q}`,{method:"DELETE",headers:SB_HDR});return r.ok;}catch{return false;}}
// ── Notify ────────────────────────────────────────────────────────────────────
async function notifyAdmin(data){
  try{const p=new URLSearchParams({action:"guestBooking",...data});await fetch(APPS_URL+"?"+p.toString(),{method:"GET",mode:"no-cors"});}catch{}
}
async function notifyGuest(data){
  try{const p=new URLSearchParams({action:"guestConfirm",...data});await fetch(APPS_URL+"?"+p.toString(),{method:"GET",mode:"no-cors"});}catch{}
}
// ── Main Widget ───────────────────────────────────────────────────────────────
function ClassWidget(){
  // mode: 'guest' | 'login' | 'member'
  const[mode,setMode]=useState(()=>{const s=lsGet("t365-cw-session");return s?"member":"guest";});
  const[session,setSession]=useState(()=>lsGet("t365-cw-session"));
  const[loginForm,setLoginForm]=useState({email:"",password:""});
  const[loginErr,setLoginErr]=useState("");
  const[loginBusy,setLoginBusy]=useState(false);
  // Shared state
  const[weekStart,setWeekStart]=useState(getWeekStart);
  const[selDay,setSelDay]=useState(()=>{const d=new Date().getDay();return d===0?0:Math.min(d-1,5);});
  const[bookings,setBookings]=useState([]);
  const[loading,setLoading]=useState(false);
  // Guest state
  const[step,setStep]=useState(1);
  const[selTime,setSelTime]=useState(null);
  const[form,setForm]=useState({name:"",email:"",phone:""});
  const[payment,setPayment]=useState("gym");
  const[busy,setBusy]=useState(false);
  const[err,setErr]=useState("");
  const[conf,setConf]=useState(null);
  // Member state
  const[bkBusy,setBkBusy]=useState({});
  const[classLimits,setClassLimits]=useState([]);
  // Dynamic class names from DB
  const[dowNames,setDowNames]=useState({1:"RISE UP",2:"STRENGTH LOWER",3:"ASCEND",4:"STRENGTH UPPER",5:"ELEVATE",6:"SUMMIT"});
  const[classDow,setClassDow]=useState({});

  const weekDates=Array.from({length:6},(_,i)=>addDays(weekStart,i));
  const isThisWeek=toDS(weekStart)===toDS(mondayOf(new Date()));
  // Stop paging once the next week would run past the booking horizon.
  const atHorizon=toDS(addDays(weekStart,7))>bookingHorizonDS();
  const selDate=weekDates[selDay];
  const selDK=toDS(selDate);

  // Load bookings
  useEffect(()=>{
    setLoading(true);setSelTime(null);
    const keys=weekDates.map(toDS);
    sbGet("bookings_slots",`date_key=in.(${keys.join(",")})&select=date_key,time`).then(d=>{setBookings(d||[]);setLoading(false);});
  },[weekStart]);

  useEffect(()=>{setSelTime(null);},[selDay]);

  // Fetch dynamic class limits (including name column for slot name overrides)
  useEffect(()=>{
    const keys=weekDates.map(toDS);
    sbGet("class_limits",`date_key=in.(${keys.join(",")})&select=time_slot,date_key,max_spots,name`).then(d=>setClassLimits(d||[]));
  },[weekStart]);

  // Fetch dynamic day-of-week class names once on mount
  useEffect(()=>{
    sbGet("coaching_notes","class_name=eq.__DOW_NAMES__&select=content").then(data=>{
      if(data&&data.length&&data[0].content){
        try{const dn=JSON.parse(data[0].content);setDowNames(p=>({...p,...dn}));}catch{}
      }
    });
    sbGet("coaching_notes","class_name=eq.__CLASS_DOW__&select=content").then(data=>{
      if(data&&data.length&&data[0].content){
        try{const cd=JSON.parse(data[0].content);if(cd&&typeof cd==="object")setClassDow(cd);}catch{}
      }
    });
  },[]);

  // ── Helpers ─────────────────────────────────────────────────────────────────
  function getMaxSpots(time,dateKey){
    const cl=classLimits.find(l=>l.time_slot===time&&l.date_key===dateKey);
    if(cl!==undefined)return cl.max_spots;
    const rule=classAddRule(classDow,dateKey,time); // recurring class carries its own capacity
    if(rule&&rule.spots)return rule.spots;
    return MAX_SPOTS;
  }

  // Returns per-slot name override if set, otherwise falls back to day-of-week class name
  function getSlotName(time,dateKey){
    const cl=classLimits.find(l=>l.time_slot===time&&l.date_key===dateKey);
    if(cl&&cl.name)return cl.name;
    const rule=classAddRule(classDow,dateKey,time);
    if(rule&&rule.name)return rule.name;
    const dow=new Date(dateKey+"T00:00:00").getDay();
    return dowNames[dow]||"";
  }

  // Visible times for selected day: base times + any extras added in class_limits, filtered to exclude hidden (max_spots=0)
  const baseTimes=selDate.getDay()===6?SAT_TIMES:WD_TIMES;
  const dayRows=classLimits.filter(l=>l.date_key===selDK);
  const visibleTimes=classTimesFor(selDK,baseTimes,
    dayRows.filter(l=>l.max_spots>0).map(l=>l.time_slot),
    dayRows.filter(l=>l.max_spots===0).map(l=>l.time_slot),
    classDow);

  const getBksFor=(dk,t)=>bookings.filter(b=>b.date_key===dk&&b.time===t);
  const userBooked=(dk,t)=>session&&getBksFor(dk,t).some(b=>b.email===session.email);

  // Login
  async function handleLogin(){
    const em=loginForm.email.trim().toLowerCase();
    const pw=loginForm.password;
    if(!em||!pw){setLoginErr("Please enter your email and password.");return;}
    setLoginBusy(true);setLoginErr("");
    const rows=await sbGet("members",`email=eq.${encodeURIComponent(em)}&select=email,name,password`);
    if(!rows||rows.length===0){setLoginErr("No account found with that email.");setLoginBusy(false);return;}
    const mb=rows[0];
    if(mb.password!==hashPw(pw)){setLoginErr("Incorrect password.");setLoginBusy(false);return;}
    const s={email:mb.email,name:mb.name};
    lsSet("t365-cw-session",s);setSession(s);setMode("member");setLoginBusy(false);
  }
  function handleLogout(){lsSet("t365-cw-session",null);setSession(null);setMode("guest");setStep(1);setSelTime(null);setConf(null);}

  // Member book
  async function handleMemberBook(time){
    const lk=`${selDK}-${time}`;
    setBkBusy(b=>({...b,[lk]:true}));
    const ok=await sbPost("bookings",{email:session.email,name:session.name,date_key:selDK,time,created_at:Date.now()});
    if(ok){setBookings(prev=>[...prev,{email:session.email,name:session.name,date_key:selDK,time}]);}
    setBkBusy(b=>({...b,[lk]:false}));
  }

  // Member cancel
  async function handleMemberCancel(time){
    const lk=`${selDK}-${time}`;
