<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<meta name="apple-mobile-web-app-title" content="Team 365"/>
<meta name="theme-color" content="#080808"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icon-192.png"/>
<link rel="icon" type="image/png" href="/icon-192.png"/>
<title>Team 365 · Book a Class</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Syncopate:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#080808;min-height:100vh}
#root{min-height:100vh}
.app{font-family:'DM Sans',sans-serif;background:#080808;color:#fff;min-height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
.app-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.hdr{padding:14px 20px 0;display:flex;flex-direction:column;background:#080808}
.hdr-row{display:flex;align-items:center;justify-content:space-between}
.hdr-left{display:flex;align-items:center;gap:10px;cursor:pointer}
.hdr-avatar-wrap{position:relative;flex-shrink:0}
.avatar-hdr{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid #1d9bf0;display:block}
.avatar-init-hdr{width:46px;height:46px;border-radius:50%;background:#1a1a1a;border:2px solid #2a2a2a;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:18px;color:#777;flex-shrink:0}
.hdr-avatar-plus{position:absolute;bottom:-1px;right:-1px;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid #080808;display:flex;align-items:center;justify-content:center;font-size:11px;color:#000;font-weight:700;line-height:1}
.hdr-name-col{display:flex;flex-direction:column}
.name-lbl{font-size:13px;letter-spacing:0.08em;color:#fff;font-weight:600}
.edit-lbl{font-size:8px;letter-spacing:0.14em;color:#555;margin-top:2px;transition:color .15s}
.hdr-left:hover .edit-lbl{color:#aaa}
.logo-area{text-align:right}
.logo-sub{font-size:8px;letter-spacing:0.22em;color:#555;font-weight:500}
.logo{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:0.18em;line-height:1;color:#444}
.logo-tag{font-size:6px;letter-spacing:0.2em;color:#333;margin-top:1px}
.hdr-website{text-align:center;padding:8px 0 10px;border-top:1px solid #111;margin-top:10px}
.hdr-website a{font-size:9px;letter-spacing:0.1em;color:#1d9bf0;text-decoration:none;font-weight:400}
.hdr-website a:hover{text-decoration:underline}
.avatar-sm{width:38px;height:38px;border-radius:50%;object-fit:cover;border:1px solid #444;cursor:pointer;display:block}
.avatar-init-sm{width:38px;height:38px;border-radius:50%;background:#1a1a1a;border:1px solid #888;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:14px;color:#999;cursor:pointer;flex-shrink:0}
.week-nav{display:flex;align-items:center;padding:18px 14px 0}
.wk-arrow{background:none;border:none;color:#888;cursor:pointer;font-size:24px;padding:4px 10px;line-height:1;transition:color .15s}
.wk-arrow:hover:not(:disabled){color:#fff}
.wk-arrow:disabled{color:#333;cursor:default}
.wk-label{flex:1;text-align:center;font-size:10px;letter-spacing:0.18em;color:#fff;font-weight:600}
.day-strip{display:flex;gap:5px;padding:10px 16px 0;overflow-x:auto;scrollbar-width:none}
.day-strip::-webkit-scrollbar{display:none}
.day-btn{flex:1;min-width:44px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;background:#141414;border:1px solid #888;border-radius:0;cursor:pointer;transition:all .15s}
.day-btn:hover:not(.da){border-color:#444}
.day-btn.dt{border-color:#555}
.day-btn.da{background:#fff;border-color:#fff}
.d-name{font-size:9px;letter-spacing:0.12em;font-weight:600;color:#999}
.d-num{font-family:'Bebas Neue',sans-serif;font-size:20px;line-height:1;color:#777}
.day-btn.dt .d-num{color:#fff}
.day-btn.dt .d-name{color:#ccc}
.day-btn.da .d-name,.day-btn.da .d-num{color:#000}
.d-dot{width:4px;height:4px;border-radius:50%;background:transparent}
.day-btn.dhb .d-dot{background:#666}
.day-btn.da.dhb .d-dot{background:#888}
.cls-wrap{flex:1;padding:14px 16px;display:flex;flex-direction:column;gap:7px}
.day-hdr{font-size:9px;letter-spacing:0.22em;font-weight:600;margin-bottom:6px;line-height:1.6}
.day-hdr span{color:#fff}
.day-hdr em{color:#aaa;font-style:normal}
.c-row{display:flex;align-items:center;gap:10px;padding:10px 13px;background:#141414;border:1px solid #888;border-radius:0;transition:border-color .15s}
.c-row.cb{border-color:#333}
.c-row.cp{opacity:0.3;pointer-events:none}
.c-time{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:0.03em;color:#fff;min-width:72px}
.c-mid{flex:1;display:flex;flex-direction:column;gap:5px}
.c-bars{display:flex;gap:2px}
.c-bar{flex:1;height:2px;border-radius:0;background:#2a2a2a;transition:background .3s}
.c-bar.ct{background:#fff}.cb-mine .c-bar.ct{background:#1d9bf0}
.c-sub{font-size:10px;letter-spacing:0.1em;color:#999;font-weight:500}
.c-sub.cl{color:#e06040}
.c-sub.co{color:#aaa}
.c-sub.ck{color:#777}
.c-sub.cf{color:#555}.c-sub.cg{color:#1d9bf0}
.c-btn{font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:0.12em;padding:8px 12px;border-radius:0;border:none;cursor:pointer;white-space:nowrap;transition:all .15s}
.c-btn.bb{background:#fff;color:#000}
.c-btn.bb:hover:not(:disabled){background:#ddd}
.c-btn.bf{background:transparent;color:#555;border:1px solid #2a2a2a;cursor:default;font-size:10px}
.c-btn.bc{background:transparent;color:#8a2515;border:1px solid #3a1208;cursor:pointer;font-size:10px}
.c-btn.bc:hover{border-color:#8a2515;color:#e06040}
.c-btn:disabled{opacity:.4;cursor:not-allowed}
.my-wrap{padding:18px 16px;flex:1;overflow-y:auto}
.my-hdr{font-size:10px;letter-spacing:0.22em;color:#fff;font-weight:600;margin-bottom:14px;text-align:center}
.my-item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#141414;border:1px solid #888;border-radius:0;margin-bottom:7px}
.my-week-sep{font-size:8px;letter-spacing:0.2em;color:#555;font-weight:600;padding:14px 0 8px;margin-top:4px;border-top:1px solid #1e1e1e}
.my-date{font-size:10px;letter-spacing:0.12em;color:#999;font-weight:500;margin-bottom:2px}
.my-time{font-family:'Bebas Neue',sans-serif;font-size:20px;color:#fff}
.my-sess{font-size:9px;letter-spacing:0.1em;color:#1d9bf0;margin-top:1px}
.my-x{font-size:10px;letter-spacing:0.08em;color:#666;background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;transition:color .15s;font-weight:500}
.my-x:hover{color:#e06040}
.no-bk{text-align:center;padding:48px 0;font-size:11px;letter-spacing:0.16em;color:#444;line-height:2.4}
.well-wrap{flex:1;overflow-y:auto}
.well-hdr{padding:16px 16px 0;text-align:center}
.well-title{font-size:10px;letter-spacing:0.22em;color:#fff;font-weight:600}
.well-sub{font-size:9px;letter-spacing:0.14em;color:#888;font-weight:500;margin-bottom:14px}
.well-badge{display:inline-flex;align-items:center;gap:6px;background:#111;border:1px solid #222;border-radius:0;padding:4px 10px;margin-bottom:14px}
.well-badge-dot{width:6px;height:6px;border-radius:50%;background:#4aaa66}
.well-badge-txt{font-size:9px;letter-spacing:0.14em;color:#888;font-weight:600}
.well-slots{padding:0 16px 16px;display:flex;flex-direction:column;gap:7px}
.well-slot{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#141414;border:1px solid #888;border-radius:0}
.well-slot.ws-mine{border-color:#2a3a2a}
.well-slot.ws-past{opacity:0.3;pointer-events:none}
.well-slot-time{font-family:'Bebas Neue',sans-serif;font-size:20px;color:#fff;min-width:72px}
.well-slot-mid{flex:1}
.well-slot-name{font-size:11px;letter-spacing:0.08em;color:#aaa;font-weight:500}
.well-slot-status{font-size:10px;letter-spacing:0.1em;color:#999;font-weight:500;margin-top:2px}
.well-slot-status.wss-mine{color:#1d9bf0}
.well-slot-status.wss-taken{color:#e06040}
.well-btn{font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:0.12em;padding:8px 12px;border-radius:0;border:none;cursor:pointer;white-space:nowrap;transition:all .15s}
.well-btn.wb-book{background:#fff;color:#000}
.well-btn.wb-book:hover:not(:disabled){background:#ddd}
.well-btn.wb-taken{background:transparent;color:#555;border:1px solid #2a2a2a;cursor:default;font-size:10px}
.well-btn.wb-cancel{background:transparent;color:#8a2515;border:1px solid #3a1208;font-size:10px;cursor:pointer}
.well-btn.wb-cancel:hover{border-color:#8a2515;color:#e06040}
.well-btn:disabled{opacity:.4;cursor:not-allowed}
.comm-wrap{display:flex;flex-direction:column;flex:1;overflow:hidden}
.comm-hdr{padding:16px 16px 0;flex-shrink:0}
.comm-title{font-size:10px;letter-spacing:0.22em;color:#fff;font-weight:600;margin-bottom:16px;text-align:center}
.comm-sub{font-size:9px;letter-spacing:0.14em;color:#888;font-weight:500;margin-bottom:12px}
.comm-compose{background:#0e0e0e;border:1px solid #888;border-radius:0;padding:12px;margin-bottom:12px}
.comm-textarea{width:100%;background:transparent;border:none;color:#fff;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:300;resize:none;outline:none;min-height:60px;line-height:1.6}
.comm-textarea::placeholder{color:#666}
.comm-compose-footer{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid #1a1a1a}
.comm-char{font-size:9px;letter-spacing:0.1em;color:#777;font-weight:500}
.comm-char.warn{color:#e06040}
.comm-post-btn{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:0.14em;padding:8px 18px;background:#fff;color:#000;border:none;border-radius:0;cursor:pointer;transition:background .15s}
.comm-post-btn:hover:not(:disabled){background:#ddd}
.comm-post-btn:disabled{background:#2a2a2a;color:#777;cursor:not-allowed}
.comm-feed{flex:1;overflow-y:auto;padding:0 16px 16px}
.comm-feed::-webkit-scrollbar{width:0}
.post-card{background:#141414;border:1px solid #888;border-radius:0;padding:13px 14px;margin-bottom:8px}
.post-card.pinned-post{background:#111;border-left:2px solid #fff}
.post-pin-label{font-size:8px;letter-spacing:0.18em;color:#888;font-weight:600;margin-bottom:8px}
.post-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.post-author{display:flex;align-items:center;gap:9px}
.post-av-img{width:30px;height:30px;border-radius:50%;object-fit:cover;border:1px solid #1d9bf0;flex-shrink:0}
.post-av-init{width:30px;height:30px;border-radius:50%;background:#1a1a1a;border:1px solid #1d9bf0;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:11px;color:#777;flex-shrink:0}
.post-av-init.admin-av{border-color:#444;color:#aaa}
.post-name{font-size:12px;letter-spacing:0.06em;color:#fff;font-weight:600}
.post-badge{font-size:8px;letter-spacing:0.14em;color:#777;font-weight:600;margin-top:1px}
.post-badge.admin-badge{color:#aaa}
.post-time{font-size:9px;letter-spacing:0.06em;color:#444;font-weight:500;white-space:nowrap;margin-top:2px}
.post-content{font-size:13px;color:#ddd;line-height:1.65;font-weight:300;word-break:break-word;margin-bottom:10px}
.post-actions{display:flex;align-items:center;gap:14px}
.post-like-btn{display:flex;align-items:center;gap:5px;background:none;border:none;cursor:pointer;padding:0;transition:opacity .15s}
.post-like-btn:hover{opacity:0.7}
.post-like-icon{font-size:14px;line-height:1;color:#cc2200}
.post-like-count{font-size:10px;letter-spacing:0.06em;color:#888;font-weight:500}
.post-like-btn.liked .post-like-count{color:#cc2200}
.post-delete{background:none;border:none;color:#333;cursor:pointer;font-size:10px;font-family:'DM Sans',sans-serif;letter-spacing:0.06em;transition:color .15s;font-weight:500}
.post-delete:hover{color:#e06040}
.post-pin-btn{background:none;border:none;color:#444;cursor:pointer;font-size:10px;font-family:'DM Sans',sans-serif;letter-spacing:0.06em;transition:color .15s;font-weight:500}
.post-pin-btn:hover{color:#aaa}
.post-pin-btn.pinned{color:#888}
.tab-bar{display:flex;border-top:1px solid #888;border-bottom:1px solid #888;margin-top:auto;background:#141414;overflow-x:auto}
.tab-btn{flex:1 0 auto;min-width:64px;padding:12px 10px;background:none;border:1px solid;border-color:#888 transparent;margin:-1px 0;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:8.5px;letter-spacing:0.1em;color:#777;font-weight:600;transition:color .15s;white-space:nowrap;position:relative}
.tab-btn.ta{color:#000;background:#fff;border-top-color:#fff;border-bottom-color:#fff}
.tab-btn:hover:not(.ta){color:#bbb}
.tab-dot{position:absolute;top:8px;right:calc(50% - 14px);width:7px;height:7px;background:#e06040;border-radius:50%;border:1px solid #080808}
.post-reply-btn{background:none;border:none;color:#444;cursor:pointer;font-size:10px;font-family:'DM Sans',sans-serif;letter-spacing:0.06em;transition:color .15s;font-weight:500}
.post-reply-btn:hover{color:#aaa}
.reply-compose{background:#111;border:1px solid #888;border-radius:0;padding:10px;margin-top:8px}
.reply-textarea{width:100%;background:transparent;border:none;color:#fff;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:300;resize:none;outline:none;min-height:44px;line-height:1.6}
.reply-textarea::placeholder{color:#444}
.reply-footer{display:flex;align-items:center;justify-content:space-between;margin-top:6px;padding-top:6px;border-top:1px solid #1a1a1a}
.reply-post-btn{font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:0.12em;padding:6px 14px;background:#fff;color:#000;border:none;border-radius:0;cursor:pointer}
.reply-post-btn:disabled{background:#222;color:#555;cursor:not-allowed}
.reply-cancel-btn{background:none;border:none;color:#555;font-size:10px;cursor:pointer;font-family:'DM Sans',sans-serif;letter-spacing:0.06em}
.reply-card{background:#0a0a0a;border-left:2px solid #1d9bf0;padding:8px 10px;margin-top:6px;border-radius:0}
.reply-author{font-size:10px;color:#666;font-weight:600;letter-spacing:0.06em;margin-bottom:3px}
.reply-author span{color:#1d9bf0}
.reply-content{font-size:12px;color:#bbb;line-height:1.6;font-weight:300}
.tag-highlight{color:#1d9bf0;font-weight:500}
.tag-dropdown{position:absolute;bottom:100%;left:0;right:0;background:#111;border:1px solid #2a2a2a;border-radius:0;max-height:160px;overflow-y:auto;z-index:50;margin-bottom:4px}
.tag-option{padding:8px 12px;font-size:12px;color:#ccc;cursor:pointer;transition:background .1s}
.tag-option:hover{background:#1a1a1a}
.compose-wrap{position:relative}
.foot{text-align:center;font-size:9px;letter-spacing:0.22em;color:#fff;padding:9px 0 4px}
.toast{position:fixed;bottom:68px;left:50%;transform:translateX(-50%);background:#fff;color:#000;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:0.15em;padding:10px 22px;border-radius:0;pointer-events:none;transition:opacity .3s;z-index:200;white-space:nowrap;opacity:0}
.toast.show{opacity:1}
.auth-page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;background:#080808;font-family:'DM Sans',sans-serif}
.auth-logo-sub{font-size:9px;letter-spacing:0.22em;color:#777;font-weight:500;margin-bottom:4px;text-align:center}
.auth-logo{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:0.2em;margin-bottom:2px;color:#fff;text-align:center}
.auth-tag{font-size:8px;letter-spacing:0.22em;color:#555;margin-bottom:48px;font-weight:600;text-align:center}
.auth-card{width:100%;max-width:380px}
.auth-title{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:0.1em;margin-bottom:24px;color:#fff}
.fl{display:block;font-size:10px;letter-spacing:0.18em;color:#bbb;font-weight:600;margin-bottom:7px}
.fi{width:100%;background:#0e0e0e;border:1px solid #2a2a2a;color:#fff;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:300;padding:14px 15px;margin-bottom:12px;outline:none;border-radius:0;transition:border-color .2s;-webkit-appearance:none}
.fi:focus{border-color:#555}
.fi::placeholder{color:#444}
.auth-btn{width:100%;background:#fff;color:#000;border:none;font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:0.18em;padding:18px;cursor:pointer;border-radius:0;margin-top:4px;transition:background .15s}
.auth-btn:hover:not(:disabled){background:#ddd}
.auth-btn:disabled{background:#111;color:#444;cursor:not-allowed}
.auth-err{font-size:12px;color:#e06040;letter-spacing:0.04em;margin-top:12px;line-height:1.5}
.auth-sw{text-align:center;margin-top:22px;font-size:12px;color:#888;letter-spacing:0.04em}
.auth-sw button{background:none;border:none;color:#ccc;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;text-decoration:underline;text-underline-offset:3px;font-weight:500}
.auth-sw button:hover{color:#fff}
.auth-reg{text-align:center;margin-top:14px;font-size:11px;color:#555;letter-spacing:0.04em}
.auth-reg a{color:#888;text-decoration:underline;text-underline-offset:3px}
.auth-reg a:hover{color:#fff}
.auth-guest-divider{display:flex;align-items:center;gap:10px;margin:20px 0 4px}
.auth-guest-divider::before,.auth-guest-divider::after{content:"";flex:1;height:1px;background:#1e1e1e}
.auth-guest-divider span{font-size:9px;letter-spacing:0.18em;color:#333;font-weight:600}
.auth-guest{text-align:center;margin-top:10px;font-size:11px;color:#555;letter-spacing:0.04em}
.auth-guest a{color:#777;text-decoration:underline;text-underline-offset:3px;font-weight:500}
.auth-guest a:hover{color:#ccc}
.prof-overlay{position:fixed;inset:0;background:#080808;z-index:50;display:flex;flex-direction:column;max-width:480px;margin:0 auto;overflow-y:auto}
.prof-hdr{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 0;flex-shrink:0}
.prof-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:0.15em;color:#fff}
.prof-close{background:none;border:none;color:#888;font-size:20px;cursor:pointer;padding:4px;transition:color .15s;line-height:1}
.prof-close:hover{color:#fff}
.prof-body{padding:22px 20px 48px}
.prof-since{font-size:10px;letter-spacing:0.18em;color:#777;margin-bottom:22px;font-weight:500}
.photo-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:26px}
.avatar-lg{width:90px;height:90px;border-radius:50%;object-fit:cover;border:2px solid #1d9bf0}
.avatar-init-lg{width:90px;height:90px;border-radius:50%;background:#111;border:2px solid #2a2a2a;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:34px;color:#555}
.prof-name-lbl{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:0.1em;color:#fff;margin-top:12px}
.photo-btn{margin-top:7px;background:none;border:none;color:#888;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:0.12em;transition:color .15s;text-decoration:underline;text-underline-offset:3px;font-weight:500}
.photo-btn:hover{color:#fff}
.prof-section{font-size:9px;letter-spacing:0.22em;color:#777;font-weight:600;margin:20px 0 13px;border-top:1px solid #1a1a1a;padding-top:20px}
.prof-save{width:100%;background:#fff;color:#000;border:none;font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:0.18em;padding:17px;cursor:pointer;border-radius:0;margin-top:6px;transition:background .15s}
.prof-save:hover:not(:disabled){background:#ddd}
.prof-save:disabled{background:#111;color:#444;cursor:not-allowed}

.scb-add-btn{width:100%;background:none;border:1px dashed #333;color:#666;font-size:10px;letter-spacing:0.1em;padding:9px;cursor:pointer;margin-top:4px;font-family:'DM Sans',sans-serif;font-weight:600}
.scb-add-btn:hover{color:#fff;border-color:#666}
.scb-autocomplete{position:relative}
.scb-ac-list{position:absolute;left:0;right:0;top:100%;background:#1a1a1a;border:1px solid #333;max-height:160px;overflow-y:auto;z-index:5}
.scb-ac-item{padding:8px 10px;font-size:12px;color:#ccc;cursor:pointer;border-bottom:1px solid #222}
.scb-ac-item:hover{background:#252525}
.scb-ac-item small{display:block;color:#555;font-size:9px;margin-top:2px}
.scb-bulk-bar{position:sticky;bottom:0;background:#1a1a1a;border:1px solid #1d9bf0;padding:10px;display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
.scb-bulk-bar input{width:70px;background:#0e0e0e;border:1px solid #2a2a2a;color:#fff;padding:7px;font-size:12px;font-family:'DM Sans',sans-serif}
.scb-check{width:16px;height:16px;flex-shrink:0;accent-color:#1d9bf0}
.scb-empty{text-align:center;padding:32px 0;font-size:10px;letter-spacing:0.16em;color:#444}
.scb-live-badge{font-size:8px;letter-spacing:0.12em;font-weight:700;padding:2px 6px;border:1px solid #4aaa66;color:#4aaa66;margin-left:8px}
.scb-edit-badge{font-size:7px;letter-spacing:0.08em;font-weight:700;padding:2px 5px;border:1px solid #1d9bf0;color:#1d9bf0;margin-left:0;background:none;cursor:pointer;font-family:'DM Sans',sans-serif}
.scb-play-btn{background:#1d9bf0;border:none;color:#fff;width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:8px}
.scb-play-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.94);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.scb-play-frame{width:100%;max-width:420px;max-height:94dvh;height:auto;background:#0a0a0a;border:1px solid #1d9bf0;overflow-y:auto;padding:38px 16px 16px;box-sizing:border-box;position:relative}
.scb-play-close{position:absolute;top:8px;right:8px;background:#fff;color:#000;border:none;width:26px;height:26px;font-size:13px;cursor:pointer;font-weight:700}
.scb-play-title{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:0.1em;color:#1d9bf0;margin-bottom:2px}
.scb-play-sub{font-size:8px;letter-spacing:0.12em;color:#666;margin-bottom:10px}
.scb-play-sec{font-size:8px;letter-spacing:0.14em;color:#555;font-weight:700;margin:14px 0 8px}
.scb-play-ex{display:flex;align-items:baseline;gap:4px;padding:3px 0;border-bottom:1px solid #1a1a1a;font-size:10px;color:#eee}
.scb-edit-hdr{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#fff;font-weight:600;cursor:pointer;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #222}
.scb-play-sq{background:#1d9bf0;border:none;color:#fff;width:15px;height:15px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:7px;padding:0}
.scb-poster-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.97);z-index:9999;display:flex;align-items:center;justify-content:center;padding:8px;box-sizing:border-box}
.scb-poster-outerframe{width:100%;max-width:966px;max-height:96dvh;background:#000;padding:10px;box-sizing:border-box}
.scb-poster-frame{width:100%;height:auto;background:#000;border:1px solid rgba(255,255,255,0.35);overflow-y:auto;position:relative;padding:32px 16px 36px;box-sizing:border-box;display:flex;flex-direction:column}
.scb-poster-frame.fs{width:100dvw;height:100dvh;justify-content:center;padding:48px 40px 60px}
.scb-poster-close{position:absolute;top:8px;right:8px;background:#fff;color:#000;border:none;width:22px;height:22px;font-size:11px;cursor:pointer;font-weight:700;z-index:2}
.scb-poster-fs-btn{position:absolute;top:8px;left:8px;background:#fff;color:#000;border:none;width:22px;height:22px;font-size:11px;cursor:pointer;font-weight:700;z-index:2}
.scb-poster-brand{position:absolute;bottom:10px;left:14px;display:flex;flex-direction:column;gap:1px}

.scb-poster-brand span{font-size:7px;letter-spacing:0.13em;color:#888;font-weight:600}
.scb-poster-frame.fs .scb-poster-brand b{font-size:16px}
.scb-poster-frame.fs .scb-poster-brand span{font-size:12px}

.scb-poster-brand-right span{font-size:7px;letter-spacing:0.13em;color:#888;font-weight:600}
.scb-poster-frame.fs .scb-poster-brand-right b{font-size:16px}
.scb-poster-frame.fs .scb-poster-brand-right span{font-size:12px}

.scb-poster-centertag b{font-size:7px;letter-spacing:0.13em;color:#888;font-weight:600;white-space:nowrap}
.scb-poster-centertag span{font-size:6px;letter-spacing:0.1em;color:#888;font-weight:500;white-space:nowrap}
.scb-poster-frame.fs .scb-poster-centertag b{font-size:12px}
.scb-poster-frame.fs .scb-poster-centertag span{font-size:10px}
.scb-poster-title{text-align:center;font-family:'DM Sans',sans-serif;font-size:clamp(9px,1.9vw,13px);letter-spacing:0.09em;color:#fff;margin:6px 0 4px;font-weight:700}
.scb-poster-frame.fs .scb-poster-title{font-size:clamp(16px,2.8vw,36px);margin-bottom:24px}

.scb-poster-col:last-child .scb-poster-col-title{right:0}
.scb-poster-frame.fs .scb-poster-col-title{top:42px;font-size:30px;letter-spacing:0.08em}
.scb-poster-col-content{flex:1;display:flex;flex-direction:column;justify-content:center}

.scb-poster-frame.fs .scb-poster-ex{margin-bottom:24px}

async function notifyWellnessBooking(name, email, dateKey, time) {
  try {
    const d = new Date(dateKey + "T12:00:00");
    const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    const dateLabel = `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
    const h = parseInt(time.split(":")[0]);
    const timeLabel = `${h%12||12}:00${h<12?"am":"pm"}`;
    const params = new URLSearchParams({
      action: "wellnessNotify",
      memberName: name,
      memberEmail: email,
      dateLabel,
      timeLabel
    });
    await fetch(APPS_SCRIPT_URL + "?" + params.toString(), {method:"GET", mode:"no-cors"});
  } catch(e) { console.log("Notify error:", e); }
}

async function authRefresh(){
  if(_refreshInFlight)return _refreshInFlight;

      if(r.status===400||r.status===401||r.status===403){setAuthToken(null);try{localStorage.removeItem("t365-refresh");localStorage.removeItem("t365-exp");}catch(e){}return false;}

      session?sbGet("personal_bests",`email=eq.${encodeURIComponent(session.email)}&select=*`):Promise.resolve([]),
      sbGet("community_bests","select=*"),
      sbGet("personal_bests","select=email,exercise_id,weight_kg,achieved_date"),
      sbGet("members_public","select=email,name,gender")
    ]);
    setExercises(exData||[]);
    const pbMap={};
    (myPBData||[]).forEach(pb=>{pbMap[pb.exercise_id]=pb;});
    setMyPBs(pbMap);
    // Self-heal: purge Progress records left behind by removed members
    const memberEmails=new Set((memData||[]).map(m=>m.email));
    const haveMembers=memberEmails.size>0;
    const genderByEmail={},nameByEmail={};
    (memData||[]).forEach(m=>{genderByEmail[m.email]=m.gender||"";nameByEmail[m.email]=m.name||"";});
    const orphanEmails=haveMembers?[...new Set((allPBData||[]).filter(r=>!memberEmails.has(r.email)).map(r=>r.email))]:[];
    for(const em of orphanEmails){await sbDelete("personal_bests",`email=eq.${encodeURIComponent(em)}`);}
    // Build per-gender community-best maps from stored records
    const maleMap={},femaleMap={};
    (cbData||[]).forEach(cb=>{if(cb.gender==="Male")maleMap[cb.exercise_id]=cb;else if(cb.gender==="Female")femaleMap[cb.exercise_id]=cb;});
    // Remove gendered records whose holder is no longer a member
    if(haveMembers){
      for(const cb of (cbData||[])){
        if(cb.gender&&cb.holder_email&&!memberEmails.has(cb.holder_email)){
          await sbDelete("community_bests",`id=eq.${cb.id}`);
          if(cb.gender==="Male")delete maleMap[cb.exercise_id];else if(cb.gender==="Female")delete femaleMap[cb.exercise_id];
        }
      }
    }
    // Recompute top per gender from visible personal bests (admins see all; members see own).
    // Only raises a record when a higher result appears, so admin manual overrides are preserved.
    const visiblePB=(allPBData||[]).filter(r=>!haveMembers||memberEmails.has(r.email));
    const topByGenderEx={Male:{},Female:{}};
    visiblePB.forEach(r=>{
      const g=genderByEmail[r.email];
      if(g!=="Male"&&g!=="Female")return;
      const w=parseFloat(r.weight_kg)||0;
      const cur=topByGenderEx[g][r.exercise_id];
      if(!cur||w>parseFloat(cur.weight_kg)){topByGenderEx[g][r.exercise_id]=r;}
    });
    for(const g of ["Male","Female"]){
      const map=g==="Male"?maleMap:femaleMap;
      for(const[exId,top] of Object.entries(topByGenderEx[g])){
        const stored=map[exId];
        if(!stored||!stored.weight_kg||parseFloat(top.weight_kg)>parseFloat(stored.weight_kg)){
          const holderName=nameByEmail[top.email]||top.email;
          const cbEntry={exercise_id:exId,gender:g,weight_kg:parseFloat(top.weight_kg),holder_name:holderName,holder_email:top.email,achieved_date:top.achieved_date||"",updated_at:Date.now()};
          if(stored){await sbPatch("community_bests",`exercise_id=eq.${exId}&gender=eq.${g}`,cbEntry);}
          else{await sbPost("community_bests",cbEntry);}
          map[exId]=cbEntry;
        }
      }
    }
    setCommunityBestsMale(maleMap);setCommunityBestsFemale(femaleMap);
    const holderEmails=[...new Set([...Object.values(maleMap),...Object.values(femaleMap)].filter(c=>c&&c.holder_email).map(c=>c.holder_email))];
    if(holderEmails.length>0){
      const photoData=await sbGet("members",`email=in.(${holderEmails.join(",")})&select=email,photo`);
      const pMap={};
      (photoData||[]).forEach(m=>{if(m.photo)pMap[m.email]=m.photo;});
      setHolderPhotos(pMap);
    }
    setLoading(false);
  }

    let ok;
    if(existing){
      ok=await sbPatch("personal_bests",`email=eq.${encodeURIComponent(session.email)}&exercise_id=eq.${exerciseId}`,data);
    }else{
      ok=await sbPost("personal_bests",data);
    }
    if(ok){
      setMyPBs(prev=>({...prev,[exerciseId]:{...existing,...data}}));
      // Update the community best for this member's gender category (if a higher result).
      const g=memberData?.gender;
      if(g==="Male"||g==="Female"){
        const map=g==="Male"?communityBestsMale:communityBestsFemale;
        const setMap=g==="Male"?setCommunityBestsMale:setCommunityBestsFemale;
        const stored=map[exerciseId];
        if(!stored||!stored.weight_kg||newWeight>parseFloat(stored.weight_kg)){
          const cbData={exercise_id:exerciseId,gender:g,weight_kg:newWeight,holder_name:session.name||session.email,holder_email:session.email,achieved_date:newDate,updated_at:Date.now()};
          let cbOk;
          if(stored){cbOk=await sbPatch("community_bests",`exercise_id=eq.${exerciseId}&gender=eq.${g}`,cbData);}
          else{cbOk=await sbPost("community_bests",cbData);}
          if(cbOk){setMap(prev=>({...prev,[exerciseId]:{...stored,...cbData}}));}
        }
      }
      showToast("Personal best saved ✓");setEditingPB(null);
    }else showToast("Save failed — try again");
    setSavingPB(false);
  }
  async function deletePB(exerciseId){
    if(!session)return;
    if(!window.confirm("Remove this personal best? This cannot be undone."))return;
    setSavingPB(true);
    const ok=await sbDelete("personal_bests",`email=eq.${encodeURIComponent(session.email)}&exercise_id=eq.${exerciseId}`);
    if(ok){
      setMyPBs(prev=>{const n={...prev};delete n[exerciseId];return n;});
      // A member has one PB per exercise; removing it drops them from their gender category.
      // Their true replacement (if any) is restored the next time an admin opens this tab.
      const g=memberData?.gender;
      if(g==="Male"||g==="Female"){
        const map=g==="Male"?communityBestsMale:communityBestsFemale;
        const setMap=g==="Male"?setCommunityBestsMale:setCommunityBestsFemale;
        const stored=map[exerciseId];

          setMap(prev=>{const n={...prev};delete n[exerciseId];return n;});

    }else showToast("Remove failed — try again");
    setSavingPB(false);
  }

  async function moveExercise(ex,dir){

    const swap=exercises[swapIdx];
    const newList=[...exercises];
    newList[idx]={...newList[idx],order_num:swap.order_num};
    newList[swapIdx]={...newList[swapIdx],order_num:ex.order_num};
    [newList[idx],newList[swapIdx]]=[newList[swapIdx],newList[idx]];
    setExercises(newList);
    await Promise.all([
      sbPatch("exercises",`id=eq.${ex.id}`,{order_num:swap.order_num}),
      sbPatch("exercises",`id=eq.${swap.id}`,{order_num:ex.order_num})

// html2canvas can't render CSS background-clip:text (the gradient trick used for category titles),
// so those titles are rendered invisible in the captured DOM (data-gradtext + color:transparent,
// same font/position) and this paints the real gradient text natively onto the resulting canvas.
async function paintGradientTitles(canvas,containerNode){
  try{
    await document.fonts.load("700 20px 'Bebas Neue'");
  }catch(e){}
  const ctx=canvas.getContext("2d");
  const containerRect=containerNode.getBoundingClientRect();
  const scaleX=canvas.width/containerRect.width;
  const scaleY=canvas.height/containerRect.height;
  const titleEls=containerNode.querySelectorAll("[data-gradtext]");
  titleEls.forEach(el=>{
    const text=el.getAttribute("data-gradtext");
    const r=el.getBoundingClientRect();
    const cs=getComputedStyle(el);
    const x=(r.left-containerRect.left)*scaleX;
    const yCenter=(r.top-containerRect.top+r.height/2)*scaleY;
    const fontSize=parseFloat(cs.fontSize)*scaleY;
    const w=r.width*scaleX;
    ctx.save();
    ctx.font=`700 ${fontSize}px 'Bebas Neue', sans-serif`;
    ctx.textBaseline="middle";
    ctx.textAlign="left";
    try{ctx.letterSpacing=`${0.05*fontSize}px`;}catch(e){}
    const grad=ctx.createLinearGradient(x,0,x+w,0);
    grad.addColorStop(0,"#1d9bf0");
    grad.addColorStop(0.5,"#ffffff");
    grad.addColorStop(1,"#1d9bf0");
    ctx.fillStyle=grad;
    ctx.fillText(text,x,yCenter);
    ctx.restore();
  });
}

function getNZDate(){

function isWorkoutReleased(monthYear,weekNum,isAdmin){
  if(isAdmin)return true;
  const now=getNZDate();
  const[y,m]=monthYear.split("-").map(Number);
  const nowY=now.getFullYear(),nowM=now.getMonth()+1;
  if(y<nowY||(y===nowY&&m<nowM))return true;
  if(y>nowY||(y===nowY&&m>nowM))return false;
  const nowDay=now.getDate(),nowHour=now.getHours();
  const curWk=nowDay<=7?1:nowDay<=14?2:nowDay<=24?3:4;
  if(weekNum<curWk)return true;
  if(weekNum>curWk)return false;
  const wkStart=[1,8,15,25][weekNum-1];
  if(nowDay>=wkStart)return true;
  if(wkStart>1&&nowDay===wkStart-1&&nowHour>=21)return true;
  return false;
}
